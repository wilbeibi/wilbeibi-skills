<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="{{CSP}}">
<meta name="referrer" content="no-referrer">
<title>{{TITLE}}</title>
<style>{{CSS}}</style>
</head>
<body class="loading">
<a class="skip" href="#doc">Skip to document</a>
<header class="top">
  <div class="top-main">
    <h1 id="doc-title">Readback</h1>
    <p id="source-note" class="muted"></p>
  </div>
  <div class="top-tools">
    <div class="search" role="search">
      <input id="search-input" type="search" placeholder="Find in text" aria-label="Find in text" spellcheck="false">
      <span id="search-count" class="muted" aria-live="polite"></span>
      <button id="search-prev" type="button" aria-label="Previous match" title="Previous match (Shift+Enter)">&#8593;</button>
      <button id="search-next" type="button" aria-label="Next match" title="Next match (Enter)">&#8595;</button>
    </div>
    <button id="expand-all" type="button">Expand all</button>
    <button id="collapse-all" type="button">Collapse all</button>
    <button id="toggle-nav" type="button" aria-expanded="true">Contents</button>
    <button id="toggle-panel" type="button" aria-expanded="true">Review</button>
  </div>
</header>

<div id="warnings" class="notice" hidden></div>
<div id="store-warn" class="notice bad" hidden></div>
<div id="anchor-warn" class="notice bad" role="status" hidden></div>

<div class="cols">
  <nav id="nav" aria-label="Contents"><ol id="nav-list"></ol></nav>

  <main id="doc" tabindex="-1"><div class="doc" id="doc-body"></div></main>

  <aside id="panel" aria-label="Review and follow-up">
    <section class="block">
      <h2>Annotations <span id="ann-count" class="muted"></span></h2>
      <div class="row">
        <button id="doc-note" type="button">Note on whole document</button>
      </div>
      <div id="editor" hidden>
        <p class="a-where" id="edit-where"></p>
        <div class="a-quote" id="edit-quote" hidden></div>
        <label class="muted" for="edit-text">Comment (optional)</label>
        <textarea id="edit-text" spellcheck="true"></textarea>
        <div class="row">
          <button id="edit-save" class="primary" type="button">Save</button>
          <button id="edit-cancel" type="button">Cancel</button>
        </div>
      </div>
      <ol id="ann-list"></ol>
      <p id="ann-empty" class="muted">Select text in the document to highlight or comment on it.</p>
    </section>

    <section class="block">
      <h2>Follow-up prompt</h2>
      <div class="row">
        <button id="build-prompt" type="button">Build prompt</button>
        <button id="rebuild-prompt" type="button" hidden>Rebuild from annotations</button>
      </div>
      <p id="prompt-state" class="muted" aria-live="polite"></p>
      <label class="muted" for="prompt">Sent exactly as it reads here. Edit freely.</label>
      <textarea id="prompt" spellcheck="true" placeholder="Build from your annotations, or write the follow-up yourself."></textarea>
      <div class="row">
        <button id="send" class="primary" type="button" hidden>Confirm &amp; send</button>
        <button id="copy" type="button">Copy</button>
        <button id="download" type="button">Download .md</button>
      </div>
      <p id="send-state" role="status" aria-live="polite"></p>
      <div class="row">
        <button id="cancel-review" class="link" type="button" hidden>Cancel review without sending</button>
      </div>
      <p id="store-state" class="muted"></p>
    </section>

    <section class="block">
      <h2>Source</h2>
      <div class="row">
        <button id="copy-source" type="button">Copy original</button>
        <button id="download-source" type="button">Download original</button>
      </div>
      <p class="muted" id="scope-note"></p>
    </section>
  </aside>
</div>

<div id="sel-menu" role="group" aria-label="Selection actions" aria-live="polite" hidden></div>

<script>window.RB_PAYLOAD={{PAYLOAD}};window.RB_LIVE={{LIVE}};</script>
<script>{{VENDOR}}</script>
<script>{{JS}}</script>
</body>
</html>
