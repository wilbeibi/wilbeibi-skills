<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="{{CSP}}">
<meta name="referrer" content="no-referrer">
<title>{{TITLE}}</title>
<style>{{CSS}}</style>
</head>
<body class="loading">
<a class="skip" href="#doc">Skip to document</a>
<header class="top">
  <div class="top-main">
    <h1 id="doc-title">Readback</h1>
    <p id="source-note" class="muted"></p>
  </div>
  <div class="top-tools">
    <div class="search" role="search">
      <input id="search-input" type="search" placeholder="Find in text" aria-label="Find in text" spellcheck="false">
      <span id="search-count" class="muted" aria-live="polite"></span>
      <button id="search-prev" type="button" aria-label="Previous match" title="Previous match (Shift+Enter)">&#8593;</button>
      <button id="search-next" type="button" aria-label="Next match" title="Next match (Enter)">&#8595;</button>
    </div>
    <button id="expand-all" type="button">Expand all</button>
    <button id="collapse-all" type="button">Collapse all</button>
    <button id="toggle-nav" type="button" aria-expanded="true">Contents</button>
    <button id="doc-note" type="button">Note on document</button>
    <button id="go-followup" type="button">Follow-up</button>
  </div>
</header>

<div id="warnings" class="notice" hidden></div>
<div id="store-warn" class="notice bad" hidden></div>
<div id="anchor-warn" class="notice bad" role="status" hidden></div>

<div class="cols">
  <nav id="nav" aria-label="Contents"><ol id="nav-list"></ol></nav>

  <main id="doc" tabindex="-1">
    <div class="doc" id="doc-body"></div>
    <section id="followup" class="followup" aria-labelledby="followup-title">
      <h2 id="followup-title">Follow-up</h2>
      <p id="prompt-state" class="muted" aria-live="polite"></p>
      <pre id="prompt-preview" tabindex="0" aria-label="Generated follow-up prompt"></pre>
      <div class="row">
        <button id="send" class="primary" type="button" hidden>Confirm &amp; send</button>
        <button id="copy" type="button">Copy</button>
        <button id="download" type="button">Download .md</button>
      </div>
      <p id="send-state" role="status" aria-live="polite"></p>
      <div class="row"><button id="cancel-review" class="link" type="button" hidden>Cancel review without sending</button></div>
      <p id="store-state" class="muted"></p>
      <div class="source-actions">
        <button id="copy-source" type="button">Copy original</button>
        <button id="download-source" type="button">Download original</button>
        <span class="muted" id="scope-note"></span>
      </div>
    </section>
  </main>
</div>

<aside id="marginalia" aria-label="Annotations in the margin"><ol id="ann-list"></ol></aside>
<div id="minimap" aria-hidden="true"><div id="mm-track"></div><div id="mm-view"></div></div>
<div id="mm-label" aria-hidden="true" hidden></div>
<div id="sel-menu" role="group" aria-label="Selection actions" aria-live="polite" hidden></div>

<script>window.RB_PAYLOAD={{PAYLOAD}};window.RB_LIVE={{LIVE}};</script>
<script>{{VENDOR}}</script>
<script>{{JS}}</script>
</body>
</html>
