# The spoken layer: who reads the lesson and how its words are pronounced. script.js stays the only place the words
# live, and how each beat is delivered (tone, pace, where it turns) is written beside it there: D('direction', beat).
model: google/gemini-3.8-flash-tts
voice: "Charon"     # one voice per lesson, picked for its subject: Charon, Sulafat or Sadaltager (references/authoring.md)

# Request labels and where the key comes from. The key is read from the environment and never printed.
headers:
  x-turnpike-client: "html-lesson:todo"
key_env: OPENROUTER_API_KEY
# base_url: defaults to $OPENROUTER_BASE_URL, then https://openrouter.ai/api/v1

# Ordered replacements applied to the spoken text only. Put longer strings first. Write one after hearing a
# misreading, not before: see "Probe before writing pairs" in references/authoring.md.
say: []
#  - ["EBITA", "E-bit-ah"]

# Built-in rewrites for a Chinese lesson: "$32.5 billion" is spoken 三百二十五亿美元, "$653" 653美元, "1.5x" 一点五倍, and
# "2020 年" and a − before a figure are made unambiguous. `none` leaves the text alone; `zh` turns them on, and
# `init --lang zh` sets it. `say` pairs run first and win.
rules: none

# USD per million audio output tokens, for the estimate `say` and `synth` print; the voice bills 25 tokens per second
# of sound. 9 is gemini-3.8-flash-tts until 2026-12-31 and Google lists 18 from 2027-01-01. Remove the key to print
# minutes only.
price_audio: 9

# A pause after set-up phrases. A tag changes the rhythm of the whole beat, not one gap: use it sparingly.
pause: " <short pause> "
pause_after: []
#  - "In other words,"
