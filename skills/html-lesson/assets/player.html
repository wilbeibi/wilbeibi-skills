<!doctype html>
<html lang="__LANG__">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>__TITLE__</title>
<style>
:root{
  --bg:#0e0e0d; --surface:#1a1a19; --raised:#252523; --line:#383835;
  --ink:#ffffff; --ink2:#c3c2b7; --ink3:#8f8e85;
  --g:#3987e5; --m:#d95926; --n:#6f6e66;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);overflow:hidden;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC","Noto Sans",sans-serif;
  font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
#fit{position:absolute;left:50%;top:50%;width:1280px;height:790px;transform-origin:center center}
#stage{position:relative;width:1280px;height:720px;background:var(--surface);border-radius:14px;overflow:hidden;border:1px solid var(--line)}
/* a scene is the 1280x600 box above the subtitle bar */
.scene{position:absolute;left:0;top:0;width:1280px;height:600px;padding:46px 64px 0;opacity:0;visibility:hidden;transition:opacity .45s}
.scene.active{opacity:1;visibility:visible}
[data-at],[data-to]{opacity:0;transform:translateY(10px);transition:opacity .5s,transform .5s;pointer-events:none}
[data-at].on,[data-to].on{opacity:1;transform:none;pointer-events:auto}
.layer{position:absolute;left:64px;right:64px}
/* text */
h1{font-size:64px;line-height:1.08;margin:6px 0 14px;font-weight:700;letter-spacing:-.5px}
h2{font-size:34px;margin:0 0 6px;font-weight:650}
.kick{font-size:17px;color:var(--ink3);letter-spacing:.3px}
.lead{font-size:24px;color:var(--ink2)}
.p{font-size:22px;line-height:1.6;color:var(--ink2)}
.p b,.card b{color:var(--ink);font-weight:650}
.small{font-size:16px;color:var(--ink3)}
/* .tag marks what is the lesson author's and not the source's */
.tag{display:inline-block;font-size:14px;font-weight:400;color:var(--ink2);border:1px solid var(--line);border-radius:99px;padding:2px 10px;vertical-align:middle;margin-left:8px;white-space:nowrap}
/* boxes */
.card{background:var(--raised);border:1px solid var(--line);border-radius:12px;padding:18px 22px;font-size:20px;line-height:1.55;color:var(--ink2)}
.card .t{font-size:22px;color:var(--ink);font-weight:650;margin-bottom:4px}
.row{display:flex;gap:20px}
.row>*{flex:1}
.tile{background:var(--raised);border:1px solid var(--line);border-radius:12px;padding:16px 22px}
.tile .v{font-size:50px;font-weight:700;line-height:1.15}
.tile .l{font-size:18px;color:var(--ink2)}
.road{margin:0;padding:0;list-style:none;display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:14px}
.road li{background:var(--raised);border:1px solid var(--line);border-radius:12px;padding:14px 16px;font-size:19px;color:var(--ink2);line-height:1.45}
.road b{display:block;font-size:15px;font-weight:600;color:var(--ink3);margin-bottom:4px}
/* term-level formulas: chips joined by operators. Real equations: MathML */
.fx{font-size:30px;font-weight:600;display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.chipx{background:var(--raised);border:1px solid var(--line);border-radius:10px;padding:8px 14px;font-size:24px;font-weight:600}
.chipx.hl,.hl{border-color:var(--m)}
.op{color:var(--ink3);font-size:28px}
math{font-size:30px}
/* swatches and fills: --g primary series, --m the thing to look at, --n neutral */
.sw{display:inline-block;width:14px;height:14px;border-radius:3px;margin-right:7px;vertical-align:-1px}
.sw.g,.fillc.g{background-color:var(--g)} .sw.m,.fillc.m{background-color:var(--m)} .sw.n,.fillc.n{background-color:var(--n)}
.legend{display:flex;gap:22px;font-size:16px;color:var(--ink2);flex-wrap:wrap}
/* one bar split into parts */
.split{display:flex;gap:2px;height:64px;font-size:22px;font-weight:650}
.split div{display:flex;align-items:center;justify-content:center;border-radius:6px}
/* horizontal bars: label | track | value */
.hb{display:grid;grid-template-columns:150px 1fr 150px;align-items:center;gap:14px;font-size:21px;margin:12px 0}
.hb .trk{height:30px;position:relative}
.hb .f{height:30px;border-radius:0 4px 4px 0;transition:width .8s;background:var(--n)}
.hb .f.m{background:var(--m)} .hb .f.g{background:var(--g)}
.hb .val{font-weight:650}
.hb .mark{position:absolute;top:-7px;bottom:-7px;width:2px;background:var(--ink)}
/* stacked columns */
.cols{display:flex;align-items:flex-end;gap:26px;position:relative}
.col{display:flex;flex-direction:column;align-items:center;transition:opacity .4s}
.col .stk{display:flex;flex-direction:column-reverse;gap:2px;width:100%}
.col .seg{width:100%;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:600;color:#fff;transition:height .8s}
.col .seg:last-child{border-radius:4px 4px 0 0}
.col .x{font-size:16px;color:var(--ink2);margin-top:8px}
.col .top{font-size:15px;color:var(--ink2);margin-bottom:6px;text-align:center;line-height:1.3}
/* tables */
table{border-collapse:collapse;width:100%;font-size:20px}
th{font-size:15px;color:var(--ink3);font-weight:500;text-align:right;padding:6px 14px;border-bottom:1px solid var(--line)}
td{text-align:right;padding:8px 14px;border-bottom:1px solid #2c2c2a;color:var(--ink2);transition:background .4s,color .4s}
th:first-child,td:first-child{text-align:left;color:var(--ink)}
td.k{color:var(--ink);font-weight:650}
tr.hl td{background:#2b2b28;color:var(--ink)}
/* state grids: one cell per state, a value inside */
.grid{display:grid;gap:8px}
.cell{background:var(--raised);border:1px solid var(--line);border-radius:10px;min-height:84px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:26px;font-weight:650;transition:background .4s,border-color .4s}
.cell small{font-size:14px;font-weight:400;color:var(--ink3)}
.cell.m{border-color:var(--m)} .cell.g{border-color:var(--g)} .cell.off{opacity:.35}
.cell.hl{border-color:var(--ink);background:#30302d}
/* diagrams in inline SVG: lanes, nodes, messages */
svg text{fill:var(--ink2);font-size:17px;font-family:inherit}
svg .ink{fill:var(--ink)} svg .dim{fill:var(--ink3)}
svg .ln{stroke:var(--line);stroke-width:2;fill:none}
svg .msg{stroke:var(--g);stroke-width:2.5;fill:none;marker-end:url(#ah-g)}
svg .msg.m{stroke:var(--m);marker-end:url(#ah-m)} svg .msg.lost{stroke:var(--n);stroke-dasharray:6 6;marker-end:none}
svg .arc{stroke:var(--ink3);stroke-width:2;fill:none;marker-end:url(#ah-n)}
svg .dot{fill:var(--ink3)} svg .dot.m{fill:var(--m)} svg .dot.g{fill:var(--g)}
math .hl{color:var(--m)}
svg .node{fill:var(--raised);stroke:var(--line);stroke-width:1.5}
svg .node.m{stroke:var(--m)} svg .node.g{stroke:var(--g)}
/* inputs and buttons inside scenes */
.inp{background:#111;border:1px solid var(--line);border-radius:8px;color:var(--ink);font-size:24px;padding:8px 12px;width:170px;font-family:inherit;font-variant-numeric:tabular-nums}
.inp:focus{outline:2px solid var(--g);border-color:transparent}
.btn{background:var(--ink);color:#111;border:0;border-radius:99px;font-size:18px;font-weight:650;padding:10px 22px;cursor:pointer;font-family:inherit}
.fb{font-size:18px;margin-left:12px;color:var(--ink2)}
/* chrome */
#chip{position:absolute;right:26px;top:20px;font-size:14px;color:var(--ink3);z-index:5}
#sub{position:absolute;left:0;right:0;bottom:0;height:120px;display:flex;align-items:center;justify-content:center;padding:0 110px;background:#141413;border-top:1px solid var(--line)}
#subt{margin:0;font-size:24px;line-height:1.55;text-align:center;text-wrap:pretty}
#subt.in{animation:si .45s}
@keyframes si{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
#hint{position:absolute;left:50%;bottom:128px;transform:translateX(-50%);background:var(--ink);color:#111;font-size:15px;font-weight:650;border-radius:99px;padding:6px 16px;opacity:0;transition:opacity .3s;pointer-events:none;z-index:6;white-space:nowrap}
#hint.on{opacity:1}
#cover{position:absolute;inset:0;background:rgba(14,14,13,.72);display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding-bottom:150px;gap:14px;z-index:20;transition:opacity .4s}
#cover.off{opacity:0;pointer-events:none}
#big{width:96px;height:96px;border-radius:50%;border:0;background:var(--ink);cursor:pointer;display:flex;align-items:center;justify-content:center}
#big svg{margin-left:6px}
#cover .small{color:var(--ink2)}
#bar{height:56px;margin-top:10px;display:flex;align-items:center;gap:10px;padding:0 6px;font-size:14px;color:var(--ink2)}
#bar button{background:transparent;border:1px solid var(--line);color:var(--ink);border-radius:8px;height:36px;min-width:36px;padding:0 10px;font-size:14px;cursor:pointer;font-family:inherit;white-space:nowrap}
#bar button:hover{background:var(--raised)}
#bar button.cur{background:var(--ink);color:#111;border-color:var(--ink)}
#bar button.onx{border-color:var(--g)}
#play{width:46px}
#track{flex:1;height:36px;position:relative;cursor:pointer;min-width:160px}
#track .bg{position:absolute;left:0;right:0;top:15px;height:6px;background:var(--line);border-radius:3px}
#fill{position:absolute;left:0;top:15px;height:6px;background:var(--ink);border-radius:3px;width:0}
#track i{position:absolute;top:11px;width:2px;height:14px;background:var(--surface)}
#time{min-width:92px;text-align:center}
#chs{display:flex;gap:4px}
.sep{width:1px;height:22px;background:var(--line);flex:none}
/*__STYLE__*/
</style>
</head>
<body>
<script>window.__ERR = []; addEventListener('error', e => { __ERR.push(String(e.message || e)); });</script>
<div id="fit">
<div id="stage">
<div id="chip"></div>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <marker id="ah-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3987e5"/></marker>
  <marker id="ah-m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d95926"/></marker>
  <marker id="ah-n" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8f8e85"/></marker>
</defs></svg>

<!--__SCENES__-->

<div id="hint"></div>
<div id="sub"><p id="subt"></p></div>
<div id="cover">
  <button id="big"><svg width="38" height="38" viewBox="0 0 24 24"><path d="M6 4l14 8-14 8z" fill="#111"/></svg></button>
  <div class="small" id="covert"></div>
  <div class="small" id="coverk"></div>
</div>
</div>

<div id="bar">
  <button id="play">▶</button>
  <button id="prev">‹</button>
  <button id="next">›</button>
  <div id="track"><div class="bg"></div><div id="fill"></div></div>
  <div id="time">0:00 / 0:00</div>
  <div class="sep"></div>
  <span id="chs"></span>
  <div class="sep"></div>
  <button id="speed"></button>
  <button id="voice"></button>
</div>
</div>

<script>
'use strict';
// Filled in by lesson.py build: {lang, speed, audio, durations}. audio/durations are null for a silent lesson.
const LESSON = /*__META__*/{lang: 'en', speed: 1, audio: null, durations: null};
const QS = new URLSearchParams(location.search);
const CHECK = QS.has('check'), STILL = CHECK || QS.has('still');
const RENDER = QS.has('render');   // ?render=MS: `lesson.py video` films the page and starts it. Nothing pauses; a wait beat holds MS instead
const UI = ({
  zh: {play: '播放/暂停（空格）', prev: '上一句（←）', next: '下一句（→）', speed: '倍速', jump: '跳到这一章',
       keys: '空格 播放/暂停 · ← → 上一句/下一句', cover: (m, n, c) => '约 ' + m + ' 分钟 · ' + n + ' 句 · ' + c + ' 章',
       voiceOn: '旁白 开', voiceOff: '旁白 关', voiceGone: '旁白不可用', noAudio: '旁白音频无法加载：请用 lesson.py mix 重新生成本页', noAudioFile: '未找到旁白音频，请将 MP3 与本页面放在同一文件夹',
       blocked: '声音未能播放，请再次点击播放', waiting: '已暂停 · 想好了按空格或 ▶ 继续', right: '✓ 对', high: '偏高，再想想', low: '偏低，再想想'},
  en: {play: 'Play / pause (space)', prev: 'Previous line (←)', next: 'Next line (→)', speed: 'Playback speed', jump: 'Jump to this chapter',
       keys: 'Space play/pause · ← → previous/next line', cover: (m, n, c) => 'About ' + m + ' min · ' + n + ' lines · ' + c + ' chapters',
       voiceOn: 'Voice on', voiceOff: 'Voice off', voiceGone: 'No voice', noAudio: 'Narration audio failed to load: rebuild this page with lesson.py mix', noAudioFile: 'Narration audio not found: keep the MP3 in the same folder as this page',
       blocked: 'Audio was blocked: press play again', waiting: 'Paused · press space or ▶ when you have an answer', right: '✓ correct', high: 'Too high, try again', low: 'Too low, try again'}
})[LESSON.lang] || null;
if (!UI) throw new Error('lesson.json lang must be "zh" or "en"');
const $ = id => document.getElementById(id);
const W = t => ({t, wait: true});   // a beat that pauses when it ends, for "stop and predict" / "you compute it"
const D = (d, b) => ({...(typeof b === 'string' ? {t: b} : b), d});   // a beat with a delivery direction for the voice; the page does not use it

// ---------- lesson data (data.js): plain values and pure functions, no DOM ----------
/*__DATA__*/

// ---------- lesson script (script.js): chapters -> scenes -> beats ----------
/*__SCRIPT__*/

// ---------- flatten script into beats ----------
const B = [], CH = [];
const units = t => [...t].reduce((n, c) => n + (c.charCodeAt(0) < 128 ? 0.5 : 1), 0);
SCRIPT.forEach((c, ci) => {
  CH.push({name: c.ch, first: B.length});
  c.scenes.forEach(([scene, lines]) => {
    if (!$(scene)) throw new Error('SCRIPT names scene "' + scene + '" but scenes.html has no <section class="scene" id="' + scene + '">');
    lines.forEach((l, step) => {
      const o = typeof l === 'string' ? {t: l} : l;
      B.push({ci, scene, step, text: o.t, wait: !!o.wait, dur: 1800 + units(o.t) * 190});
    });
  });
});
const NARRATED = !!(LESSON.audio && LESSON.durations);
if (NARRATED) {
  if (LESSON.durations.length !== B.length) throw new Error('narration has ' + LESSON.durations.length + ' clips for ' + B.length + ' beats: rerun synth, mix and build');
  B.forEach((b, i) => { b.dur = LESSON.durations[i]; });
}
if (RENDER) B.forEach((b, i) => { if (b.wait || i === B.length - 1) b.dur += (+QS.get('render') || 0) * (LESSON.speed || 1); });
const CUM = []; let TOTAL = 0;
B.forEach(b => { CUM.push(TOTAL); TOTAL += b.dur; });

// per-scene hooks for what CSS reveal cannot express: HOOK.sceneId = step => {...}. Must be idempotent (seeking calls it out of order).
const HOOK = {};

// ---------- player ----------
const scenes = [...document.querySelectorAll('.scene')];
let idx = 0, elapsed = 0, playing = false, speed = LESSON.speed || 1, voice = NARRATED && !RENDER, token = 0, last = 0, scale = 1;
const SPEEDS = [...new Set([0.75, 0.85, 1, 1.1, 1.25, 1.5, 2, speed])].sort((a, b) => a - b);
const narration = voice ? new Audio(LESSON.audio) : null;   // a filmed page gets its sound from the clips, not from here
if (narration) { narration.preload = 'auto'; narration.preservesPitch = true; }

function hint(t) { $('hint').textContent = t; $('hint').classList.add('on'); }
function stopNarration() { token++; if (narration) narration.pause(); }
function startNarration() {
  if (!voice) return;
  stopNarration();
  const my = token;
  narration.currentTime = (CUM[idx] + elapsed) / 1000;
  narration.playbackRate = speed;
  narration.play().catch(() => {
    if (my !== token) return;
    playing = false; hint(UI.blocked); paint();
  });
}
if (narration) {
  narration.addEventListener('error', () => {
    pause();
    voice = false;
    $('voice').textContent = UI.voiceGone; $('voice').classList.remove('onx'); $('voice').disabled = true;
    if (!STILL) hint(String(LESSON.audio).startsWith('data:') ? UI.noAudio : UI.noAudioFile);
  });
  narration.addEventListener('ended', () => {
    if (!playing || !voice) return;
    idx = B.length - 1; elapsed = B[idx].dur;
    render(); beatEnd();
  });
}

function render() {
  const b = B[idx];
  scenes.forEach(s => s.classList.toggle('active', s.id === b.scene));
  const sc = $(b.scene);
  sc.dataset.step = b.step;
  sc.querySelectorAll('[data-at],[data-to]').forEach(e => {
    const a = +(e.dataset.at || 0), t = e.dataset.to === undefined ? 1e9 : +e.dataset.to;
    e.classList.toggle('on', b.step >= a && b.step <= t);
  });
  if (HOOK[b.scene]) HOOK[b.scene](b.step);
  const st = $('subt');
  st.textContent = b.text; st.classList.remove('in'); void st.offsetWidth; st.classList.add('in');
  $('chip').textContent = CH[b.ci].name + ' · ' + (idx + 1) + ' / ' + B.length;
  [...$('chs').children].forEach((x, i) => x.classList.toggle('cur', i === b.ci));
  $('hint').classList.remove('on');
  paint();
}
function clock(ms) { const s = Math.floor(ms / 1000); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); }
function paint() {
  const t = CUM[idx] + Math.min(elapsed, B[idx].dur);
  $('fill').style.width = (t / TOTAL * 100) + '%';
  $('time').textContent = clock(t) + ' / ' + clock(TOTAL);
  $('play').textContent = playing ? '❚❚' : '▶';
}
function go(i, off) {
  idx = Math.max(0, Math.min(B.length - 1, i));
  elapsed = off || 0;
  stopNarration();
  render();
  if (playing) startNarration();
}
function play() {
  $('cover').classList.add('off');
  if (idx === B.length - 1 && elapsed >= B[idx].dur) { playing = true; go(0); return; }
  if (elapsed >= B[idx].dur && idx < B.length - 1) { playing = true; go(idx + 1); return; }
  playing = true; $('hint').classList.remove('on'); startNarration(); paint();
}
function pause() {
  if (playing && voice && !narration.paused) elapsed = Math.max(0, Math.min(B[idx].dur, narration.currentTime * 1000 - CUM[idx]));
  playing = false; stopNarration(); paint();
}
function toggle() { playing ? pause() : play(); }
function beatEnd() {
  const b = B[idx];
  if (b.wait && !RENDER) { pause(); elapsed = b.dur; hint(UI.waiting); paint(); }
  else if (idx === B.length - 1) { pause(); elapsed = b.dur; paint(); }
  else { idx++; elapsed = Math.max(0, elapsed - b.dur); render(); }
}
function tick(now) {
  const dt = Math.min(250, now - last); last = now;
  if (playing) {
    if (voice) elapsed = Math.max(0, narration.currentTime * 1000 - CUM[idx]);   // the audio clock drives subtitles
    else elapsed += dt * speed;
    if (elapsed >= B[idx].dur) beatEnd(); else paint();
  }
  requestAnimationFrame(tick);
}

// ---------- controls ----------
CH.forEach((c, i) => {
  const b = document.createElement('button');
  b.textContent = c.name; b.title = UI.jump;
  b.onclick = () => { $('cover').classList.add('off'); go(c.first); };
  $('chs').appendChild(b);
  if (i > 0) { const m = document.createElement('i'); m.style.left = (CUM[c.first] / TOTAL * 100) + '%'; $('track').appendChild(m); }
});
[['play', UI.play], ['prev', UI.prev], ['next', UI.next], ['speed', UI.speed], ['big', UI.play]].forEach(([id, t]) => { $(id).title = t; $(id).setAttribute('aria-label', t); });
$('play').onclick = toggle;
$('big').onclick = play;
$('prev').onclick = () => go(idx - 1);
$('next').onclick = () => go(idx + 1);
$('speed').textContent = speed + 'x';
$('speed').onclick = () => {
  speed = SPEEDS[(SPEEDS.indexOf(speed) + 1) % SPEEDS.length];
  $('speed').textContent = speed + 'x';
  if (narration) narration.playbackRate = speed;
};
if (NARRATED) {
  const label = () => { $('voice').textContent = voice ? UI.voiceOn : UI.voiceOff; $('voice').classList.toggle('onx', voice); $('voice').setAttribute('aria-pressed', String(voice)); };
  label();
  $('voice').onclick = () => { voice = !voice; label(); if (voice && playing) startNarration(); else stopNarration(); };
} else $('voice').style.display = 'none';

// In scenes: <button data-go> continues past a wait beat; <button data-restart> starts over.
document.querySelectorAll('[data-go]').forEach(b => { b.onclick = () => { playing = true; go(idx + 1); }; });
document.querySelectorAll('[data-restart]').forEach(b => { b.onclick = () => { playing = true; go(0); }; });

let drag = false;
function seek(e) {
  const r = $('track').getBoundingClientRect();
  const t = Math.max(0, Math.min(0.9999, (e.clientX - r.left) / r.width)) * TOTAL;
  let i = B.length - 1;
  while (i > 0 && CUM[i] > t) i--;
  $('cover').classList.add('off');
  go(i, t - CUM[i]);
}
$('track').addEventListener('pointerdown', e => { drag = true; $('track').setPointerCapture(e.pointerId); seek(e); });
$('track').addEventListener('pointermove', e => { if (drag) seek(e); });
$('track').addEventListener('pointerup', () => { drag = false; });

document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT') return;
  if (e.code === 'Space') { e.preventDefault(); toggle(); }
  else if (e.key === 'ArrowRight') { $('cover').classList.add('off'); go(idx + 1); }
  else if (e.key === 'ArrowLeft') go(idx - 1);
});

// "You compute it": quiz('inputId', 'feedbackId', target, tolerance, {pct: true}) - pct accepts 0.48 for 48.
function quiz(inputId, outId, target, tol, opt) {
  const inp = $(inputId), out = $(outId);
  inp.addEventListener('input', () => {
    let v = parseFloat(inp.value.replace(/[^0-9.eE+-]/g, ''));
    if (isNaN(v)) { out.textContent = ''; return; }
    if (opt && opt.pct && Math.abs(v) < 1) v *= 100;
    out.textContent = Math.abs(v - target) <= tol ? UI.right : (v > target ? UI.high : UI.low);
  });
}

function fit() {
  if (!innerWidth || !innerHeight) return;
  scale = CHECK || RENDER ? 1 : Math.min(innerWidth / 1296, innerHeight / 800);
  $('fit').style.transform = 'translate(-50%,-50%) scale(' + scale + ')';
}

// ---------- lesson hooks (hooks.js): builders, HOOK entries, quiz() wiring ----------
/*__HOOKS__*/

// <span data-v="key"></span> shows V.key from data.js, so a number on screen is never typed twice.
document.querySelectorAll('[data-v]').forEach(e => {
  if (typeof V === 'undefined' || !(e.dataset.v in V)) throw new Error('data-v="' + e.dataset.v + '" is not a key of V in data.js');
  e.textContent = V[e.dataset.v];
});

// ---------- start ----------
if (STILL || RENDER) {   // ?check and ?render pin the stage to the top left at 1:1; ?render keeps the transitions, they are the film
  const s = document.createElement('style');
  s.textContent = (STILL ? '*{transition:none!important;animation:none!important}' : '#cover,#hint{display:none!important}#stage{border-radius:0;border-color:var(--surface)}')
    + (CHECK || RENDER ? '#fit{left:0!important;top:0!important;transform:none!important}' : '');
  document.head.appendChild(s);
}
addEventListener('resize', fit); fit();
$('covert').textContent = UI.cover(Math.max(1, Math.round(TOTAL / speed / 60000)), B.length, CH.length);
$('coverk').textContent = UI.keys;
render();
if (QS.has('beat')) { $('cover').classList.add('off'); go(parseInt(QS.get('beat'), 10) - 1); }   // ?beat=N is 1-based, as the chip shows it
requestAnimationFrame(t => { last = t; requestAnimationFrame(tick); });

// ---------- ?check: step through every beat and measure what a reviewer would otherwise have to eyeball ----------
function selfCheck() {
  const issues = [];
  const add = (level, i, what, detail) => issues.push({level, beat: i + 1, scene: B[i].scene, what, detail});
  const S = $('stage').getBoundingClientRect();
  const lineH = parseFloat(getComputedStyle($('subt')).lineHeight);
  const hidden = e => !!e.closest('[data-at]:not(.on),[data-to]:not(.on)') || getComputedStyle(e).display === 'none';
  const seen = e => !hidden(e) && (!e.checkVisibility || e.checkVisibility({opacityProperty: true, visibilityProperty: true, checkOpacity: true, checkVisibilityCSS: true}));
  const NUMERAL = /(?<![\w.])[−-]?\$?\d[\d,]*(?:\.\d+)?%?/g;
  const figures = t => new Set([...t.matchAll(NUMERAL)].map(m => m[0].replace(/^[−$-]+/, '').replace(/[%,]+$/, '')).filter(n => n.length > 1));
  const name = e => (e.id ? '#' + e.id : e.tagName.toLowerCase() + (e.classList.length ? '.' + [...e.classList].join('.') : '')) + ' "' + (e.textContent || '').trim().replace(/\s+/g, ' ').slice(0, 40) + '"';
  let prevSig = null, prevScene = null;
  const numbers = {};   // every numeral a viewer can read, with the first beat it appears on: input to `lesson.py numbers`
  for (let i = 0; i < B.length; i++) {
    go(i);
    const b = B[i], sc = $(b.scene);
    const walk = document.createTreeWalker(sc, NodeFilter.SHOW_TEXT);
    let shown = b.text, screen = '';
    for (let n = walk.nextNode(); n; n = walk.nextNode()) if (n.textContent.trim() && !hidden(n.parentElement)) {
      shown += ' \n ' + n.textContent;
      if (seen(n.parentElement)) screen += ' \n ' + n.textContent;
    }
    // A guess screen must not show the answer: a figure the next line says for the first time, readable here already.
    // Figures of two or more characters only; an answer in words, or drawn as a shape, is for the eyes gate.
    if (b.wait && i + 1 < B.length) {
      const said = figures(B.slice(0, i + 1).map(x => x.text).join(' \n ')), here = figures(screen);
      const leak = [...figures(B[i + 1].text)].filter(n => !said.has(n) && here.has(n));
      if (leak.length) add('warn', i, 'this pause already shows a figure the next line says for the first time (a leak if it is the answer)', leak.join(', ') + ' (next: ' + B[i + 1].text.slice(0, 40) + ')');
    }
    for (const m of shown.matchAll(NUMERAL)) {
      const n = m[0].replace(/^[−$-]+/, '').replace(/%$/, '').replace(/,$/, '');
      if (n && !(n in numbers)) numbers[n] = {beat: i + 1, near: shown.slice(Math.max(0, m.index - 24), m.index + 24).replace(/\s+/g, ' ')};
    }
    const lines = Math.round($('subt').getBoundingClientRect().height / lineH);
    if (lines > 2) add('error', i, 'subtitle wraps to ' + lines + ' lines (max 2)', b.text);
    const out = [];
    sc.querySelectorAll('*').forEach(e => {
      if (out.some(p => p.contains(e)) || hidden(e)) return;
      const r = e.getBoundingClientRect();
      if (!r.width || !r.height) return;
      if (r.left < S.left - 1 || r.top < S.top - 1 || r.right > S.left + 1281 || r.bottom > S.top + 601) {
        out.push(e);
        add('error', i, 'outside the 1280x600 scene box', name(e) + ' box ' + [r.left - S.left, r.top - S.top, r.right - S.left, r.bottom - S.top].map(Math.round).join(','));
      }
    });
    const kids = [...sc.children].filter(e => !hidden(e) && !e.hasAttribute('data-overlap-ok')).map(e => [e, e.getBoundingClientRect()]).filter(([, r]) => r.width && r.height);
    for (let x = 0; x < kids.length; x++) for (let y = x + 1; y < kids.length; y++) {
      const p = kids[x][1], q = kids[y][1];
      const w = Math.min(p.right, q.right) - Math.max(p.left, q.left), h = Math.min(p.bottom, q.bottom) - Math.max(p.top, q.top);
      if (w > 4 && h > 4) add('error', i, 'blocks overlap by ' + Math.round(h) + 'px', name(kids[x][0]) + ' / ' + name(kids[y][0]));
    }
    // text that is wider or taller than the box it sits in (a bar segment, a cell, a chip)
    sc.querySelectorAll('*').forEach(e => {
      if (e.namespaceURI !== 'http://www.w3.org/1999/xhtml' || hidden(e) || !e.clientWidth) return;
      if (![...e.childNodes].some(n => n.nodeType === 3 && n.textContent.trim())) return;
      if (e.scrollWidth > e.clientWidth + 1) add('error', i, 'text is wider than its box', name(e));
    });
    // labels inside one drawing that sit on top of each other
    const labels = [...sc.querySelectorAll('svg text')].filter(e => !hidden(e) && e.textContent.trim()).map(e => [e, e.getBoundingClientRect()]);
    for (let x = 0; x < labels.length; x++) for (let y = x + 1; y < labels.length; y++) {
      const p = labels[x][1], q = labels[y][1];
      if (Math.min(p.right, q.right) - Math.max(p.left, q.left) > 2 && Math.min(p.bottom, q.bottom) - Math.max(p.top, q.top) > 2)
        add('error', i, 'SVG labels overlap', name(labels[x][0]) + ' / ' + name(labels[y][0]));
    }
    const sig = sc.innerHTML;
    if (prevScene === b.scene && sig === prevSig) add('warn', i, 'nothing on screen changes with this beat', b.text.slice(0, 50));
    prevSig = sig; prevScene = b.scene;
  }
  if ($('bar').scrollWidth > $('bar').clientWidth + 1) issues.push({level: 'error', beat: 0, scene: '', what: 'control bar overflows', detail: 'shorten chapter names: ' + CH.map(c => c.name).join(' | ')});
  go(0);
  return {beats: B.length, chapters: CH.map(c => c.name), waits: B.filter(b => b.wait).length, narrated: NARRATED, seconds: Math.round(TOTAL / 1000), issues, numbers};
}
</script>
<script>
// Always leaves a report in ?check mode, including when the lesson script above threw.
if (new URLSearchParams(location.search).has('check')) {
  let rep;
  try { rep = selfCheck(); } catch (e) { __ERR.push(String(e && e.message || e)); rep = {issues: []}; }
  rep.errors = __ERR;
  const el = document.createElement('script');
  el.type = 'application/json'; el.id = 'lesson-report';
  el.textContent = JSON.stringify(rep).replace(/</g, '\\u003c');
  document.body.appendChild(el);
}
</script>
</body>
