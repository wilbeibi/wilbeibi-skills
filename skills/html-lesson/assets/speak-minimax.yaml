# The fallback voice: MiniMax, one even reading with a speed per beat. Copy this file over a lesson's speak.yaml
# when the Gemini voice of the starter cannot be used. Directions written with D() in script.js are not sent to it.
# The lessons voiced with it play at `speed` 0.85 in lesson.json; the starter's 1 is for the Gemini voice.
model: minimax/speech-2.8-turbo
voice: "English_expressive_narrator"     # a Chinese lesson: "Chinese (Mandarin)_Radio_Host", and `rules: zh` below
speed_default: 1.0

# Request labels and where the key comes from. The key is read from the environment and never printed.
headers:
  x-turnpike-client: "html-lesson:todo"
key_env: OPENROUTER_API_KEY
# base_url: defaults to $OPENROUTER_BASE_URL, then https://openrouter.ai/api/v1

# Slower or faster for single beats, keyed by the beat number the player shows (1-based). Slow down formula beats.
speed: {}
#  12: 0.95

# Ordered replacements applied to the spoken text only. Put longer strings first.
say: []
#  - ["EBITA", "E-bit-ah"]
#  - ["÷", " divided by "]

# Built-in rewrites of what the Mandarin voice misreads: "$32.5 billion", "2020 年", a − before a figure, "1.5x".
# `zh` turns them on, `none` leaves the text alone. `say` pairs run first and win.
rules: none

# USD per million billed characters, for the estimate `say` and `synth` print. 60 is minimax/speech-2.8-turbo on
# OpenRouter, measured 2026-10-12; it bills a non-ASCII character as two. Remove the key to print characters only.
price: 60

# A short breath after set-up phrases. `pause` is whatever pause markup the voice model accepts.
pause: "<#0.18#>"
pause_after: []
#  - "In other words,"
