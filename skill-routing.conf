# skill-routing.conf — which skills appear where. Mechanism: bin/skill-route.
#
# Grammar (one directive per line, whitespace-separated; # starts a comment line):
#   external NAME [PATH]   NAME lives outside this repo's skills/. With PATH the
#                          link source is PATH instead of ~/.agents/skills/NAME.
#   profile NAME PRED...   named predicate set; PREDs on one line AND together,
#                          repeated "profile NAME" lines OR together.
#   NAME always            user-level: linked into global harness dirs by --global.
#   NAME TOKEN...          project-level; TOKEN = predicate or profile name.
#                          Tokens on one line AND; repeat the NAME line for OR.
# Predicates (relative to project root):
#   file:REL   path exists            dir:REL   directory exists
#   glob:PAT   tree has file matching PAT (depth<=4, skips .git/node_modules/.venv)
#   grep:REL:ERE   file REL matches extended regex ERE

# ---- externals (not in this repo's skills/) ----
external riverrun ~/src/riverrun/skills/riverrun
external catchup
external find-skills
external housekeeping
external impeccable
external exa-search
external tavily-search
external jj
external advanced-evaluation
external bdi-mental-states
external context-compression
external context-degradation
external context-engineering-collection
external context-fundamentals
external context-optimization
external evaluation
external filesystem-context
external hosted-agents
external memory-systems
external multi-agent-patterns
external project-development
external tool-design

# ---- profiles ----
profile code dir:.git
profile code dir:.jj
profile skillsrepo dir:skills glob:SKILL.md
profile frontend glob:*.tsx
profile frontend glob:*.jsx
profile frontend glob:*.svelte
profile frontend glob:*.vue
profile frontend glob:*.html
profile llm grep:package.json:@anthropic-ai|anthropic|openai|langchain|llamaindex|ai-sdk|litellm
profile llm grep:pyproject.toml:anthropic|openai|langchain|litellm|dspy|llama-index|instructor
profile llm grep:requirements.txt:anthropic|openai|langchain|litellm|dspy|llama-index|instructor

# ---- always-on (user-level, --global) ----
obsidian-capture always
obsidian-vault-search always
paper-search always
web-recap always
catchup always
find-skills always
housekeeping always
exa-search always
tavily-search always

