name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  validate-skills:
    name: Validate skills
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        run: python -m pip install uv

      - name: Validate skill frontmatter
        run: uv run scripts/check_skill_frontmatter.py

      - name: Test prose checker
        run: python3 skills/write-docs/scripts/test_prose_lint.py

      - name: Test repository archaeology report
        run: bash skills/grok-repo/scripts/test_archaeology.sh

      - name: Check catalog
        run: uv run scripts/build_catalog.py --check

      - name: Test route-skill
        run: python3 skills/route-skill/scripts/test_route_skill.py
