name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  validate-skills:
    name: Validate skill frontmatter
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        run: python -m pip install uv

      - name: Validate skill frontmatter
        run: uv run scripts/check_skill_frontmatter.py
